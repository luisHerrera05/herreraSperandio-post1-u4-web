<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Colaborador — U4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>🧑‍💻 Registro de Colaborador</h1>
    <p class="subtitulo">Unidad 4 · Programación Web · Parte 2</p>

    <form id="form-registro" novalidate>

      <div class="campo-grupo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" name="nombre"
               required minlength="3" maxlength="60"
               placeholder="Ej: Ana García">
        <span class="msg-error" id="error-nombre"></span>
      </div>

      <div class="campo-grupo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" name="email"
               required placeholder="usuario@dominio.com">
        <span class="msg-error" id="error-email"></span>
      </div>

      <div class="campo-grupo">
        <label for="username">Nombre de usuario</label>
        <input id="username" type="text" name="username"
               required pattern="[a-zA-Z0-9_]{4,20}"
               placeholder="Solo letras, números y guion bajo (4-20)">
        <span class="msg-error" id="error-username"></span>
      </div>

      <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password"
               required minlength="8"
               placeholder="Mínimo 8 caracteres">
        <span id="fortaleza"></span>
        <span class="msg-error" id="error-password"></span>
      </div>

      <div class="campo-grupo">
        <label for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" type="password" name="confirmar"
               required placeholder="Repita la contraseña">
        <span class="msg-error" id="error-confirmar"></span>
      </div>

      <div class="campo-grupo">
        <label for="rol">Rol en el equipo</label>
        <select id="rol" name="rol" required>
          <option value="">Seleccione un rol</option>
          <option value="desarrollador">Desarrollador</option>
          <option value="disenador">Diseñador</option>
          <option value="tester">Tester</option>
          <option value="lider">Líder de equipo</option>
        </select>
        <span class="msg-error" id="error-rol"></span>
      </div>

      <div class="campo-grupo oculto" id="grupo-equipo">
        <label for="equipo">Equipo a cargo</label>
        <input id="equipo" type="text" name="equipo"
               placeholder="Ej: Backend, QA, Frontend">
        <span class="msg-error" id="error-equipo"></span>
      </div>

      <div class="campo-grupo">
        <label for="horas">Horas disponibles por semana</label>
        <input id="horas" type="number" name="horas"
               required min="5" max="40"
               placeholder="Entre 5 y 40">
        <span class="msg-error" id="error-horas"></span>
      </div>

      <div class="campo-grupo campo-checkbox">
        <label for="terminos">
          <input id="terminos" type="checkbox" name="terminos" required>
          Acepto los términos de uso del sistema interno
        </label>
        <span class="msg-error" id="error-terminos"></span>
      </div>

      <button type="submit" id="btn-registrar">Registrarse</button>
      <div id="mensaje-exito" class="oculto">
        ✅ Registro exitoso. Bienvenido al equipo.
      </div>
    </form>
  </main>
  <script src="validacion.js" defer></script>
</body>
</html>
